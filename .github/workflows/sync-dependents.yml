name: Sync to dependent repos

# Rebuilds output/index.html and output/music_index_full.csv from the
# tracked data/scores.csv + data/spotify_links.csv + data/album_art.csv (not
# the raw scraped sources, which are gitignored and can take hours to
# re-scrape), then publishes to repos that depend on it:
#  - Portfolio (Vercel-deployed at joavn.dev): the built index page, served at joavn.dev/mpi
#    (physically stored under projects/mpi/ in that repo; the public URL is unchanged).
#  - Versed: the full scored CSV, which its server reads as a data file.
# Mirrors the same pattern CHORIDOR-web uses.
# Requires repo secrets:
#  - PORTFOLIO_TOKEN: a PAT with write access to JoachimVN/Portfolio.
#  - VERSED_TOKEN: a PAT with write access to JoachimVN/Versed.
#
# The build job commits any resulting output/ changes back to this repo's
# main before the sync jobs run, so index.html/music_index_full.csv can
# never silently drift from scores.csv — no dependence on remembering to
# run the pipeline locally before merging.

on:
  push:
    branches: [main]
    paths:
      - 'data/scores.csv'
      - 'data/spotify_links.csv'
      - 'data/album_art.csv'
      - 'src/export_csv.py'
      - 'src/export.py'
      - 'src/utils.py'
      - 'config.py'
      - 'output/index.html'
      - 'output/music_index_full.csv'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Only this job pushes back to this repo (the commit-and-push step
    # below) — sync-portfolio/sync-versed only read this repo and push to
    # others via their own PAT secrets, so they don't need this permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --only-binary :all: -r requirements.txt

      - name: Rebuild index.html and music_index_full.csv from data/scores.csv
        run: |
          python src/export_csv.py
          python src/export.py

      - name: Commit and push if output/ changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/index.html output/music_index_full.csv
          git diff --staged --quiet || git commit -m "chore: rebuild output/ from data/scores.csv [skip ci]"
          git diff --staged --quiet || git push

  sync-portfolio:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone portfolio repo
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: git clone "https://x-access-token:${PORTFOLIO_TOKEN}@github.com/JoachimVN/Portfolio.git" portfolio

      - name: Sync built pages -> projects/mpi/
        run: |
          rm -rf portfolio/projects/mpi
          mkdir -p portfolio/projects/mpi
          cp output/index.html portfolio/projects/mpi/index.html

      - name: Commit and push
        run: |
          cd portfolio
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/mpi/
          git diff --staged --quiet || git commit -m "chore: sync MPI from Music-Popularity-Index@${{ github.sha }}"
          git push

  sync-versed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone Versed repo
        env:
          VERSED_TOKEN: ${{ secrets.VERSED_TOKEN }}
        run: git clone --branch dev "https://x-access-token:${VERSED_TOKEN}@github.com/JoachimVN/Versed.git" versed

      - name: Sync scored CSV -> server/src/data/
        run: |
          mkdir -p versed/server/src/data
          cp output/music_index_full.csv versed/server/src/data/music_index_full.csv

      - name: Commit and push
        run: |
          cd versed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/src/data/music_index_full.csv
          git diff --staged --quiet || git commit -m "chore: sync music_index_full.csv from Music-Popularity-Index@${{ github.sha }}"
          git push
